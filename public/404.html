<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PatriPRO - Gestion de Patrimoine</title>
    <script>
      // SPA redirect for GitHub Pages
      // Extract the full path (everything after the domain)
      var pathName = location.pathname;
      // Store the full path to handle after index.html loads
      sessionStorage.setItem('redirect', location.href);
      // Redirect to base path (index.html will handle the actual routing)
      // For GitHub Pages: /PatriPro/ or /PatriPro/index.html
      var basePath = pathName.split('/').slice(0, -1).join('/') + '/';
      if (!pathName.endsWith('/') && !pathName.endsWith('index.html')) {
        location.replace(basePath + 'index.html');
      }
    </script>
  </head>
  <body>
    <p>Redirection en cours...</p>
  </body>
</html>
